<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">智慧医疗 — AI 智能医疗问诊平台</title>
  <desc id="desc">以知识检索和症状图谱辅助健康问答，连接患者、医生与管理员。下方示意健康问题经文档检索与图谱匹配形成回答上下文。</desc>
  <rect width="1200" height="380" rx="24" fill="#183f36"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
