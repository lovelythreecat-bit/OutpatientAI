      <text x="65" y="212" font-size="32" fill="#dce9b9">从健康提问，到就医服务。</text>
      <text x="1128" y="62" text-anchor="end" font-size="22" fill="#dce9b9">患者 / 医生 / 管理员</text>
      <text x="1128" y="141" text-anchor="end" font-size="34" font-weight="600" fill="#f5f6ef">AI 智能医疗问诊平台</text>
      <text x="1128" y="184" text-anchor="end" font-size="23" fill="#dce9b9">Vue 3 · FastAPI · LangChain</text>
    </g>
    <path d="M64 248H1136" stroke="#4c6d5f" stroke-width="1"/>
